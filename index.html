<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbour Planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm night-window ambient, like an airport departures board seen through glass
   IDEA: the TV is a second window — same view, same direction, with labels on the sky
   PICTURE: horizon + hill silhouette, compass ticks, a pointer that tracks the real plane
   COLOUR: deep harbour navy, soft sky gradient, amber accent for the live plane
   TYPE/LAYOUT: Figtree; big flight card follows the pointer; clock idle state */
:root{--bg:#070b14;--sky:#0e1a30;--ink:#eaf0f8;--dim:#7d8aa3;--acc:#ffb400;--line:#25334d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;text-shadow:0 1px 12px rgba(0,0,0,.35);background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;cursor:none}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
#wx{position:absolute;left:5.3vw;top:calc(6vh + 10vw);font-size:1.5vw;color:var(--ink);opacity:.85}
svg#scene{position:absolute;inset:0;width:100%;height:100%}
#clock{position:absolute;left:5vw;top:6vh;font-weight:800;font-size:7vw;line-height:1;letter-spacing:-.02em}
#date{position:absolute;left:5.3vw;top:calc(6vh + 7.6vw);font-size:1.6vw;color:var(--ink);opacity:.75}
#status{position:absolute;left:5.3vw;bottom:4vh;font-size:1.2vw;color:var(--dim)}
#list{position:absolute;right:4vw;top:6vh;font-size:1.25vw;color:var(--dim);text-align:right;line-height:1.7}
#list b{color:var(--ink);font-weight:600}
#card{position:absolute;left:0;top:0;will-change:transform;min-width:24vw;padding:1.4vw 1.8vw;border-radius:1vw;background:rgba(8,14,26,.82);border:1px solid var(--line);box-shadow:0 1vw 3vw rgba(0,0,0,.5);transition:opacity .6s;opacity:0}
#card.on{opacity:1}
#card .fn{font-weight:800;font-size:3.4vw;line-height:1;color:var(--acc)}
#card .al{font-size:1.3vw;color:var(--dim);margin-top:.3vw}
#card .rt{display:flex;align-items:center;gap:1vw;margin-top:1vw;font-weight:800;font-size:2.6vw}
#card .rt span.arr{color:var(--dim);font-weight:400}
#card .ct{display:flex;justify-content:space-between;gap:2vw;font-size:1.1vw;color:var(--dim)}
#card .meta{margin-top:1vw;font-size:1.15vw;color:var(--ink);opacity:.85}
#ptr{opacity:0;transition:opacity .6s}
#ptr.on{opacity:1}
.edge{position:absolute;bottom:26vh;font-size:1.2vw;color:var(--dim)}
#demo{position:absolute;right:4vw;bottom:4vh;font-size:1.1vw;color:var(--acc);display:none}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<svg id="scene"></svg>
<div id="clock">--:--</div>
<div id="date"></div>
<div id="wx"></div>
<div id="list"></div>
<div id="card"><div class="fn"></div><div class="al"></div><div class="rt"></div><div class="ct"></div><div class="meta"></div></div>
<div id="status">Starting…</div>
<div id="demo">Demo mode: simulated plane</div>
<script>
{
// ---------- SETTINGS (override with ?facing=42&fov=100&lat=..&lon=..&offset=0&demo=1) ----------
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) && !isNaN(+q.get(k))) ? +q.get(k) : d;
const CFG = {
  lat: num('lat', -41.2923),     // 20 Oriental Terrace, Oriental Bay (approx.)
  lon: num('lon', 174.7868),
  heightM: num('height', 50),    // eye height above sea level (m); replaced by terrain ground + agl unless ?height= set
  agl: num('agl', 45),           // eye height above the ground outside (m) — ~3 m per storey; level 15 ≈ 45
  facing: num('facing', 42),     // compass bearing straight out of the window
  fov: num('fov', 110),          // horizontal degrees the screen represents
  offset: num('offset', 0),      // nudge pointer left(-)/right(+) in degrees to calibrate
  radiusNm: num('radius', 25),   // search radius, nautical miles
  maxElev: num('maxelev', 40),   // elevation angle at top of screen
  poll: num('poll', 5) * 1000,
  demo: q.get('demo') === '1'
};

const $ = id => document.getElementById(id);
const svg = $('scene'), card = $('card');
const routes = {};          // callsign -> route or null
let hero = null, others = [], lastMeta = 0, sm = null, smId = null, smT = 0, skyline = null, planes = [], lastOk = 0, demoT = 0, feedSource = '', lastErr = '';

// ---------- geometry ----------
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function bearingDist(lat, lon) {
  const p1 = rad(CFG.lat), p2 = rad(lat), dl = rad(lon - CFG.lon);
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  const a = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return { brg: (deg(Math.atan2(y, x)) + 360) % 360, dist: 2 * R * Math.asin(Math.sqrt(a)) };
}
// dead reckoning: where is the plane *now*, from its last fix + ground speed, track and climb rate
function predict(p, now) {
  const dt = Math.min(20, Math.max(0, (now - p.t0) / 1000));
  let lat = p.lat, lon = p.lon, altFt = p.altFt;
  if (p.gs && p.track != null) {
    const d = p.gs * 0.514444 * dt, t = rad(p.track), p1 = rad(lat), a = d / R;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(a) + Math.cos(p1) * Math.sin(a) * Math.cos(t));
    lon = lon + deg(Math.atan2(Math.sin(t) * Math.sin(a) * Math.cos(p1), Math.cos(a) - Math.sin(p1) * Math.sin(p2)));
    lat = deg(p2);
  }
  altFt = Math.max(0, altFt + (p.vr || 0) / 60 * dt);
  const bd = bearingDist(lat, lon);
  return { brg: bd.brg, dist: bd.dist, rel: rel(bd.brg), elev: deg(Math.atan2(altFt * 0.3048 - CFG.heightM, bd.dist)), altFt };
}
const rel = b => ((b - CFG.facing - CFG.offset + 540) % 360) - 180;   // -180..180, 0 = straight out
const HORIZON = 0.74, WATER = 0.06;   // sea line position, harbour strip height (fractions of screen)
// elevation angle -> screen y. A gentle power curve gives low angles (hills, climbing planes) a little extra room.
function angToY(e) {
  const H = innerHeight, hy = H * HORIZON;
  if (e >= 0) return hy - (hy - H * 0.1) * Math.pow(Math.min(e, CFG.maxElev) / CFG.maxElev, 0.72);
  return hy + H * WATER * Math.min(1, -e / 1.5);
}
const bx = b => innerWidth * (0.5 + rel(b) / CFG.fov);
function toScreen(p) {
  return { x: innerWidth * (0.5 + p.rel / CFG.fov), y: angToY(Math.max(0, p.elev)) };
}
// a few landmarks across the harbour, labelled on the water line
const LANDMARKS = [['Matiu / Somes Is', -41.2585, 174.8645], ['Petone', -41.2268, 174.8750], ['Eastbourne', -41.2915, 174.8985], ['Point Halswell', -41.2832, 174.8261]];
const compass = b => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(b / 22.5) % 16];

// ---------- scene (horizon, hills, compass ticks, pointer) ----------
function drawScene() {
  const W = innerWidth, H = innerHeight, hy = H * HORIZON;
  const ty = hy + H * WATER + 6;
  let ticks = '';
  for (let b = 0; b < 360; b += 5) {
    const r = rel(b); if (Math.abs(r) > CFG.fov / 2) continue;
    const x = bx(b), major = b % 45 === 0, mid = b % 15 === 0;
    ticks += `<line x1="${x}" x2="${x}" y1="${ty}" y2="${ty + (major ? 20 : mid ? 12 : 6)}" stroke="#3a4b6b" stroke-width="${major ? 2 : 1}"/>`;
    if (major || mid) ticks += `<text x="${x}" y="${ty + (major ? 46 : 34)}" fill="${major ? '#9fb0cc' : '#56647e'}" font-size="${major ? W * .013 : W * .009}" text-anchor="middle" font-family="Figtree,sans-serif">${major ? compass(b) : b + '°'}</text>`;
  }
  // terrain: far ridges first (hazy), then mid, then near (darkest) — painter's order
  let land = '';
  if (skyline) {
    const layers = [['far', '#1a2a46', .55], ['mid', '#122038', .78], ['near', '#0b1628', .95]];
    for (const [k, fill, op] of layers) {
      const all = skyline.profile, sm = all.map((p, i) => ({ b: p.b, [k]: ((all[i - 1] || p)[k] + 2 * p[k] + (all[i + 1] || p)[k]) / 4 }));
      const pts = sm.filter(p => Math.abs(rel(p.b)) <= CFG.fov / 2 + 2);
      if (!pts.length) continue;
      let d = `M${bx(pts[0].b)} ${hy}`;
      for (const p of pts) d += ` L${bx(p.b).toFixed(1)} ${angToY(Math.max(0, p[k])).toFixed(1)}`;
      d += ` L${bx(pts[pts.length - 1].b)} ${hy} Z`;
      land += `<path d="${d}" fill="${fill}" opacity="${op}" stroke="${k === 'far' ? 'rgba(160,185,220,.18)' : 'none'}" stroke-width="1"/>`;
    }
  }
  let marks = '';
  for (const [name, la, lo] of LANDMARKS) {
    const bb = bearingDist(la, lo).brg; if (Math.abs(rel(bb)) > CFG.fov / 2 - 3) continue;
    const x = bx(bb);
    marks += `<line x1="${x}" x2="${x}" y1="${hy + 2}" y2="${hy + H * WATER * .45}" stroke="rgba(160,185,220,.35)"/><text x="${x}" y="${hy + H * WATER * .8}" fill="rgba(170,190,220,.7)" font-size="${W * .0085}" text-anchor="middle" font-family="Figtree,sans-serif">${name}</text>`;
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <defs><radialGradient id="glow"><stop offset="0" stop-color="#ffb400" stop-opacity=".55"/><stop offset="1" stop-color="#ffb400" stop-opacity="0"/></radialGradient></defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3150"/><stop offset="1" stop-color="#0a1424"/></linearGradient>
    <rect x="0" y="${hy}" width="${W}" height="${H - hy}" fill="#070b14"/>
    <rect x="0" y="${hy}" width="${W}" height="${H * WATER}" fill="url(#sea)"/>
    ${land}
    <line x1="0" x2="${W}" y1="${hy}" y2="${hy}" stroke="rgba(160,185,220,.25)"/>
    ${marks}
    ${ticks}
    <g id="others"></g>
    <g id="ptr">
      <line id="stem" x1="0" y1="0" x2="0" y2="0" stroke="#ffb400" stroke-opacity=".5" stroke-dasharray="4 6"/>
      <circle r="${W * .03}" fill="url(#glow)"/>
      <circle r="${W * .006}" fill="#ffb400"/>
      <circle r="${W * .012}" fill="none" stroke="#ffb400" stroke-width="2"><animate attributeName="r" from="${W * .008}" to="${W * .022}" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/></circle>
    </g>`;
}

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function fetchPlanes() {
  const { lat, lon, radiusNm } = CFG;
  const j = await getJSON(`/api/planes?lat=${lat}&lon=${lon}&dist=${radiusNm}`);
  feedSource = j.source || '';
  return j.ac || [];
}
async function lookupRoute(cs) {
  if (!cs || cs in routes) return;
  routes[cs] = null;
  try {
    const j = await getJSON(`/api/route?cs=${encodeURIComponent(cs)}`);
    const f = j.response && j.response.flightroute;
    if (f) routes[cs] = {
      num: f.callsign_iata || f.callsign,
      airline: f.airline ? f.airline.name : '',
      from: f.origin.iata_code || f.origin.icao_code, fromCity: f.origin.municipality || f.origin.name,
      to: f.destination.iata_code || f.destination.icao_code, toCity: f.destination.municipality || f.destination.name
    };
  } catch (e) {}
}
function normalise(list) {
  return list.filter(a => a.lat != null && a.lon != null && a.alt_baro !== 'ground').map(a => {
    const bd = bearingDist(a.lat, a.lon), altM = (+a.alt_baro || +a.alt_geom || 0) * 0.3048;
    const cs = (a.flight || '').trim();
    return {
      lat: a.lat, lon: a.lon, track: a.track != null ? a.track : (a.true_heading != null ? a.true_heading : null),
      vr: a.baro_rate != null ? a.baro_rate : (a.geom_rate || 0), t0: Date.now() - (a.seen_pos || 0) * 1000,
      id: a.hex, cs, type: a.t || '', reg: a.r || '', altFt: Math.round(altM / 0.3048),
      gs: a.gs ? Math.round(a.gs) : null, brg: bd.brg, dist: bd.dist, rel: rel(bd.brg),
      elev: deg(Math.atan2(altM - CFG.heightM, bd.dist))
    };
  }).sort((a, b) => a.dist - b.dist);
}
function demoPlanes() {
  // simulated departure climbing north out of WLG across the harbour
  demoT = (demoT + CFG.poll / 1000) % 240;
  const t = demoT / 240, lat = -41.327 + t * 0.32, lon = 174.805 + t * 0.03;
  routes['ANZ421'] = { num: 'NZ421', airline: 'Air New Zealand', from: 'WLG', fromCity: 'Wellington', to: 'AKL', toCity: 'Auckland' };
  return [{ hex: 'demo1', flight: 'ANZ421', lat, lon, alt_baro: Math.round(500 + t * 14000), gs: 288, track: 4, baro_rate: 3500, t: 'A320', r: 'ZK-OXA' }];
}

// ---------- render ----------
function render() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit', hour12: false });
  $('date').textContent = now.toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' });

  const tnow = Date.now();
  for (const p of planes) Object.assign(p, predict(p, tnow));
  const inView = planes.filter(p => Math.abs(p.rel) <= CFG.fov / 2 && p.elev > -1);
  hero = inView[0] || null; others = inView.slice(1);
  const ptr = document.getElementById('ptr');
  if (hero) {
    const r = routes[hero.cs];
    card.querySelector('.fn').textContent = r ? r.num : (hero.cs || hero.reg || hero.id.toUpperCase());
    card.querySelector('.al').textContent = r ? (r.airline || hero.cs) : (hero.cs ? 'Route unknown' : 'No callsign');
    card.querySelector('.rt').innerHTML = r ? `${r.from}<span class="arr">→</span>${r.to}` : '';
    card.querySelector('.ct').innerHTML = r ? `<span>${r.fromCity || ''}</span><span>${r.toCity || ''}</span>` : '';
    ptr.classList.add('on'); card.classList.add('on');
  } else { ptr.classList.remove('on'); card.classList.remove('on'); }

  $('list').innerHTML = planes.slice(0, 5).map(p => {
    const r = routes[p.cs], lab = r ? `<b>${r.num}</b> ${r.from}→${r.to}` : `<b>${p.cs || p.id.toUpperCase()}</b>`;
    return `${lab} · ${(p.dist / 1000).toFixed(0)} km ${compass(p.brg)}`;
  }).join('<br>') || 'No aircraft nearby';

  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  $('status').textContent = age == null ? ('Connecting to flight feed…' + (lastErr ? ' (' + lastErr + ')' : '')) : (age > 60 ? `Feed lost ${age}s ago — retrying` : `${planes.length} aircraft within ${CFG.radiusNm} nm · ${inView.length} in view` + (feedSource ? ` · ${feedSource}` : ''));
}

function animatePlanes() {
  const now = Date.now(), ptr = document.getElementById('ptr'), stem = document.getElementById('stem');
  if (hero && ptr) {
    const pr = predict(hero, now), tgt = toScreen(pr);
    // ease toward the predicted spot so new data blends in instead of snapping
    const dt = Math.min(0.2, (now - smT) / 1000); smT = now;
    if (!sm || smId !== hero.id) { sm = { x: tgt.x, y: tgt.y }; smId = hero.id; }
    const k = 1 - Math.exp(-dt * 1.2);
    sm.x += (tgt.x - sm.x) * k; sm.y += (tgt.y - sm.y) * k;
    const s = sm;
    ptr.setAttribute('transform', `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`);
    stem.setAttribute('y2', innerHeight * HORIZON - s.y);
    if (now - lastMeta > 1000) {
      lastMeta = now;
      card.querySelector('.meta').textContent = [hero.type, Math.round(pr.altFt).toLocaleString() + ' ft', hero.gs ? hero.gs + ' kt' : '', (pr.dist / 1000).toFixed(1) + ' km ' + compass(pr.brg)].filter(Boolean).join(' · ');
      const g = document.getElementById('others');
      g.innerHTML = others.map(p => { const q2 = toScreen(predict(p, now)); return `<circle cx="${q2.x}" cy="${q2.y}" r="4" fill="#9fb0cc" opacity=".7"/><text x="${q2.x + 9}" y="${q2.y + 4}" fill="#7d8aa3" font-size="${innerWidth * .009}" font-family="Figtree,sans-serif">${routes[p.cs] ? routes[p.cs].num : p.cs}</text>`; }).join('');
    }
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let left = s.x + 40, top = s.y - ch - 30;
    if (left + cw > innerWidth - 30) left = s.x - cw - 40;
    if (top < 20) top = s.y + 40;
    card.style.transform = `translate(${left.toFixed(1)}px, ${top.toFixed(1)}px)`;
  }
}

async function tick() {
  try {
    const raw = CFG.demo ? demoPlanes() : await fetchPlanes();
    planes = normalise(raw); lastOk = Date.now();
    await Promise.all(planes.slice(0, 6).map(p => lookupRoute(p.cs)));
  } catch (e) { lastErr = String(e.message || e); }
  render();
}


// ---------- WEATHER BACKGROUND (Open-Meteo, no key) ----------
// override for testing: ?weather=clear|cloudy|rain|storm|fog|drizzle  &wind=60  &time=day|night|dusk
const cv = $('sky'), cx = cv.getContext('2d');
const WX = { code: 1, cloud: 30, wind: 15, windDir: 0, temp: null, isDay: 1, sunrise: null, sunset: null };
const CODES = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
const kind = c => c >= 95 ? 'storm' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : c >= 61 || (c >= 80 && c <= 82) ? 'rain' : c >= 51 ? 'drizzle' : c === 45 || c === 48 ? 'fog' : c === 3 ? 'cloudy' : 'clear';
async function fetchWeather() {
  const ov = q.get('weather');
  if (ov) {
    const map = { clear: [0, 5], cloudy: [3, 95], rain: [63, 100], storm: [95, 100], fog: [45, 100], drizzle: [53, 90], snow: [73, 100] };
    const m = map[ov] || map.clear; WX.code = m[0]; WX.cloud = m[1]; WX.wind = num('wind', 40); WX.windDir = num('winddir', 350); WX.temp = 14;
  } else {
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
      const j = await getJSON(u), c = j.current;
      Object.assign(WX, { code: c.weather_code, cloud: c.cloud_cover, wind: c.wind_speed_10m, gust: c.wind_gusts_10m, windDir: c.wind_direction_10m, temp: c.temperature_2m, isDay: c.is_day,
        sunrise: new Date(j.daily.sunrise[0]).getTime(), sunset: new Date(j.daily.sunset[0]).getTime() });
    } catch (e) {}
  }
  const dirName = compass((WX.windDir + 360) % 360).replace(/^(N|S|E|W)$/, m => ({N:'Northerly',S:'Southerly',E:'Easterly',W:'Westerly'})[m]);
  $('wx').textContent = [WX.temp != null ? Math.round(WX.temp) + '°' : '', CODES[WX.code] || '', Math.round(WX.wind) + ' km/h ' + dirName + (WX.gust > WX.wind + 15 ? ', gusts ' + Math.round(WX.gust) : '')].filter(Boolean).join(' · ');
  seedClouds();
}
// 0 = night, 1 = full day, with dawn/dusk blend
function daylight() {
  const t = q.get('time'); if (t) return t === 'day' ? 1 : t === 'dusk' ? 0.35 : 0;
  const now = Date.now(), H = 3600e3;
  if (!WX.sunrise) { const h = new Date().getHours(); return h >= 7 && h < 20 ? 1 : 0; }
  if (now < WX.sunrise - H || now > WX.sunset + H) return 0;
  if (now < WX.sunrise + H) return (now - (WX.sunrise - H)) / (2 * H);
  if (now > WX.sunset - H) return 1 - (now - (WX.sunset - H)) / (2 * H);
  return 1;
}
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
let clouds = [], drops = [], stars = [], flash = 0, lastFrame = performance.now();
function seedClouds() {
  const n = Math.round(3 + WX.cloud / 8);
  clouds = Array.from({ length: n }, () => ({ x: Math.random(), y: 0.08 + Math.random() * 0.55, s: 0.12 + Math.random() * 0.22, o: 0.25 + Math.random() * 0.45 }));
  const k = kind(WX.code), dn = k === 'storm' ? 700 : k === 'rain' ? 450 : k === 'drizzle' ? 220 : k === 'snow' ? 260 : 0;
  drops = Array.from({ length: dn }, () => ({ x: Math.random(), y: Math.random(), v: 0.6 + Math.random() * 0.6 }));
  if (!stars.length) stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random() * 0.75, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 }));
}
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  const W = cv.width = innerWidth, H = cv.height = innerHeight, hy = H * HORIZON;
  const k = kind(WX.code), day = daylight(), dusk = 1 - Math.abs(day - 0.5) * 2; // peaks at twilight
  const grey = Math.min(1, WX.cloud / 100) * (k === 'clear' ? 0.4 : 1);
  // sky gradient: night navy -> day blue, pulled toward grey by cloud, warmed at dusk
  let top = mix([5, 9, 18], [38, 78, 128], day), bot = mix([18, 32, 58], [112, 150, 188], day);
  top = mix(top, mix([20, 24, 32], [78, 88, 102], day), grey * 0.8);
  bot = mix(bot, mix([34, 40, 52], [118, 126, 138], day), grey * 0.8);
  if (grey < 0.7) bot = mix(bot, [235, 130, 80], dusk * 0.55 * (1 - grey));
  const g = cx.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  cx.fillStyle = g; cx.fillRect(0, 0, W, hy);
  // stars on clear nights
  if (day < 0.3 && grey < 0.6) {
    const a = (1 - day / 0.3) * (1 - grey / 0.6);
    for (const s of stars) { cx.globalAlpha = a * (0.5 + 0.5 * Math.sin(now / 900 + s.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x * W, s.y * hy, s.r, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
  }
  // wind across the screen: wind FROM windDir blows toward windDir+180
  const toward = rel((WX.windDir + 180) % 360), wx = Math.sin(rad(toward)) * WX.wind / 3.6; // m/s sideways
  // clouds
  const cc = mix([60, 70, 88], [196, 204, 216], day);
  cx.filter = 'blur(' + Math.round(W / 90) + 'px)';
  for (const c of clouds) {
    c.x += wx * dt * 0.0015 * (0.6 + c.s); if (c.x > 1.3) c.x = -0.3; if (c.x < -0.3) c.x = 1.3;
    const cw = c.s * W, ch = cw * 0.32, x = c.x * W, y = c.y * hy;
    cx.fillStyle = `rgba(${cc[0]},${cc[1]},${cc[2]},${c.o * 0.7 * Math.max(0.25, grey)})`;
    for (let i = 0; i < 5; i++) { cx.beginPath(); cx.ellipse(x + (i - 2) * cw * 0.2, y - Math.sin(i * 1.3) * ch * 0.35, cw * 0.28, ch * 0.6, 0, 0, 7); cx.fill(); }
  }
  cx.filter = 'none';
  // fog
  if (k === 'fog') { const f = cx.createLinearGradient(0, hy * 0.3, 0, hy); f.addColorStop(0, 'rgba(180,188,198,0)'); f.addColorStop(1, `rgba(180,188,198,${day > 0.4 ? .75 : .35})`); cx.fillStyle = f; cx.fillRect(0, 0, W, hy); }
  // rain / drizzle / snow, slanted by the wind
  if (drops.length) {
    const snow = k === 'snow', fall = snow ? 0.12 : k === 'drizzle' ? 0.9 : 1.6, len = snow ? 0 : k === 'drizzle' ? 10 : 22;
    const slant = Math.max(-1.2, Math.min(1.2, wx / 12));
    cx.strokeStyle = day > 0.4 ? 'rgba(220,230,245,.45)' : 'rgba(160,180,210,.35)'; cx.fillStyle = 'rgba(240,245,255,.8)'; cx.lineWidth = 1.2;
    cx.beginPath();
    for (const d of drops) {
      d.y += fall * d.v * dt; d.x += slant * fall * d.v * dt * 0.55;
      if (d.y > 1) { d.y = 0; d.x = Math.random() * 1.2 - 0.1; } if (d.x > 1.1) d.x -= 1.2; if (d.x < -0.1) d.x += 1.2;
      const x = d.x * W, y = d.y * H;
      if (snow) { cx.moveTo(x + 2, y); cx.arc(x, y, 2, 0, 7); } else { cx.moveTo(x, y); cx.lineTo(x - slant * len, y - len); }
    }
    snow ? cx.fill() : cx.stroke();
  }
  // lightning
  if (k === 'storm') { if (Math.random() < dt * 0.12) flash = 1; if (flash > 0) { cx.fillStyle = `rgba(230,235,255,${flash * 0.5})`; cx.fillRect(0, 0, W, H); flash -= dt * 3; } }
  const sc = cx.createRadialGradient(W * .12, H * .12, 0, W * .12, H * .12, W * .38); sc.addColorStop(0, 'rgba(5,9,18,.45)'); sc.addColorStop(1, 'rgba(5,9,18,0)'); cx.fillStyle = sc; cx.fillRect(0, 0, W, hy);
  const sr = cx.createRadialGradient(W * .9, H * .1, 0, W * .9, H * .1, W * .28); sr.addColorStop(0, 'rgba(5,9,18,.4)'); sr.addColorStop(1, 'rgba(5,9,18,0)'); cx.fillStyle = sr; cx.fillRect(0, 0, W, hy);
  // ground below horizon
  cx.fillStyle = '#070b14'; cx.fillRect(0, hy, W, H - hy);
  animatePlanes();
  requestAnimationFrame(frame);
}
fetchWeather(); setInterval(fetchWeather, 10 * 60 * 1000);
requestAnimationFrame(frame);

if (CFG.demo) $('demo').style.display = 'block';
drawScene();
async function loadSkyline() {
  const from = Math.floor(CFG.facing + CFG.offset - CFG.fov / 2 - 5), to = Math.ceil(CFG.facing + CFG.offset + CFG.fov / 2 + 5);
  const key = `skyline:${CFG.lat},${CFG.lon},${CFG.agl},${from},${to}`;
  try { const c = localStorage.getItem(key); if (c) skyline = JSON.parse(c); } catch (e) {}
  if (!skyline) {
    try {
      skyline = await getJSON(`/api/skyline?lat=${CFG.lat}&lon=${CFG.lon}&agl=${CFG.agl}&from=${from}&to=${to}`);
      try { localStorage.setItem(key, JSON.stringify(skyline)); } catch (e) {}
    } catch (e) { return; }
  }
  if (!q.has('height') && isFinite(skyline.eye)) CFG.heightM = skyline.eye;
  drawScene(); render();
}
loadSkyline();
addEventListener('resize', () => { drawScene(); render(); });
tick();
setInterval(tick, CFG.poll);
setInterval(render, 15000);
}
</script>
